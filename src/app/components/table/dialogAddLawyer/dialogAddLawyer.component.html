<h1 mat-dialog-title>Modification du profil de {{data.prenom}} {{data.nom}}</h1>
<div mat-dialog-content>
  <p>
  <mat-form-field appearance="fill">
    <mat-label>Prénom</mat-label>
    <input matInput [(ngModel)]="data.prenom">
  </mat-form-field>
</p>
<p>
  <mat-form-field appearance="fill">
    <mat-label>Nom</mat-label>
    <input matInput [(ngModel)]="data.nom">
  </mat-form-field>
</p>
<p>
  <mat-form-field appearance="fill">
    <mat-label>e-mail</mat-label>
    <input matInput [(ngModel)]="data.email">
  </mat-form-field>
</p>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onNoClick()">No Thanks</button>
  <button mat-button [mat-dialog-close]="data.email" cdkFocusInitial>Ok</button>
</div>
