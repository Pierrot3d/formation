<ng-container *ngIf="!isReportedHours && !isGroupHours">
  <input
    matInput
    autocomplete="off"
    type="number"
    (change)="onChangeEvent($event)"
    value="{{ this.value }}"
    min="0"
    max="1000"
  />
</ng-container>

<ng-container *ngIf="isReportedHours">
  <input
    matInput
    autocomplete="off"
    type="number"
    (change)="onChangeEventReport($event)"
    value="{{ this.value }}"
    min="0"
    max="1000"
  />
</ng-container>

<ng-container *ngIf="isGroupHours">
  <input
    matInput
    autocomplete="off"
    type="number"
    (change)="onChangeEventGroup($event)"
    value="{{ this.value }}"
    min="0"
    max="1000"
  />
</ng-container>
