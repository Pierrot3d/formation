<mat-tab-group>
  <mat-tab label="Importer">
    <h1 mat-dialog-title>Importer un fichier XLSX</h1>
    <div mat-dialog-content>
      <app-import-excel></app-import-excel>
      <div mat-dialog-actions>
        <button mat-button (click)="onNoClick()"> Annuler </button>
      </div>
    </div>
  </mat-tab>
  <mat-tab label="Exporter">

    <h1 mat-dialog-title>Exporter un fichier XLSX</h1>
    <div mat-dialog-content>
      <app-export-excel></app-export-excel>
      <div mat-dialog-actions>
        <button mat-button (click)="onNoClick()"> Annuler </button>
      </div>
    </div>
  </mat-tab>

</mat-tab-group>
