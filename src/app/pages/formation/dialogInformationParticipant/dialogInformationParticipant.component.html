<div mat-dialog-actions style="justify-content: right;">
  <mat-icon style="cursor: pointer" (click)="onNoClick()">close</mat-icon>
  </div>

<div class="button-container">
  <button mat-raised-button class="button">
    Ajouter un participant
    <mat-icon>add</mat-icon>
  </button>
</div>

<p>Date : {{this.data.startTMP}} - {{this.data.endTMP}}</p>

<p>Durée de la formation : {{this.data.duration}} heures</p>

<table mat-table [dataSource]="this.dataTable" class="mat-elevation-z8">


  <!-- Group Column -->
  <ng-container matColumnDef="participant">
    <th mat-header-cell *matHeaderCellDef > Participant </th>
    <td mat-cell *matCellDef="let element" style="cursor: pointer;"> {{element.value.nom}} {{element.value.prenom}}</td>
  </ng-container>

    <!-- trash Column -->
    <ng-container matColumnDef="trash">
      <th mat-header-cell *matHeaderCellDef > Supprimer </th>
      <td mat-cell *matCellDef="let element">  <mat-icon class="trash"> delete </mat-icon> </td>
    </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>


</table>
